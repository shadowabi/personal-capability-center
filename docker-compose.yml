services:
  postgresql:
    image: pgvector/pgvector:pg16
    container_name: ai-memory-db
    environment:
      POSTGRES_DB: ai_memory
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_memory"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - OPENCODE_API_URL=http://host.docker.internal:4096
    container_name: ai-memory-backend
    env_file:
      - ./backend/.env.local
    environment:
      AI_MEMORY_HOST: localhost
      AI_MEMORY_PORT: 5432
      AI_MEMORY_DB: ai_memory
      AI_MEMORY_USER: ai_user
      AI_MEMORY_PASSWORD: ai_password_123
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:8000
    network_mode: host
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000/api
    container_name: ai-memory-frontend
    environment:
      - VITE_API_URL=http://localhost:8000/api
    ports:
      - "5173:5173"
      - "8001:8000"
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  ai-memory-network:
    driver: bridge

volumes:
  postgres_data:
    external: true
    name: shadow_postgres_data
